# Grand Brasil - BI Estoque
# Configuracoes de regras de negocio
# Edite este arquivo para ajustar os parametros de analise

aging:
  green_max_days: 30
  yellow_max_days: 60
  orange_max_days: 90

price_reduction_rules:
  - days_threshold: 45
    reduction_percent: 5.0
    min_margin_percent: 3.0
  - days_threshold: 60
    reduction_percent: 10.0
    min_margin_percent: 2.0
  - days_threshold: 90
    reduction_percent: 15.0
    min_margin_percent: 1.0

b2b_scoring:
  aging_weight: 0.4
  concentration_weight: 0.4
  margin_weight: 0.2
  score_threshold: 7.0
  concentration_limit: 3

# Avaliacao de troca (trade-in appraisal)
appraisal:
  year_tolerance: 2              # +/- anos para buscar comparaveis
  loja_target_margin: 15.0       # Margem bruta alvo para Loja (B2C) %
  revenda_target_margin: 5.5     # Margem bruta alvo para Revenda (B2B) %
  min_comparables: 3             # Minimo de comparaveis para confianca "media"
  sales_history_file: "Vendas 2025-2026 processado.xlsx"
  # Base de avaliacoes: planilha Google (APPRAISAL_HISTORY_URL) cobre 2026+;
  # o Excel legado complementa com as linhas anteriores a appraisal_legacy_until.
  appraisal_legacy_file: "Avaliações 2025 e 2026.xlsx"
  appraisal_legacy_until: "2026-01-01"
  # Ponderacao por recencia: meia-vida em dias (vendas mais antigas pesam menos)
  recency_halflife_days: 180
  # Ajuste por ano modelo: % de ajuste no preco do comparavel por ano de diferenca
  # Ex: comparavel 2023 avaliando um 2024 -> preco ajustado x 1.075
  # Calibrado a partir de 3k vendas reais: mediana ~7.4%/ano (era 10%)
  year_pct_per_year: 7.5
  # Filtro de blindados nos comparaveis (cerca de preco por faixa de ano):
  # thresholds em analysis/_blindado.py (_blindado_filter_premium); 2019 ou mais antigo nao filtra.

  # ── Portao "preco oficial x sugestao" (30/10/2026, secao 4.8 da revisao) ──────
  # Dentro do portao o valor e preco oficial; fora, e sugestao para a mesa fechar.
  # Regua 2026 (confianca calibrada walk-forward): dentro 44% das avaliacoes, MAPE 5,1%,
  # 87% a ±10%, erro >15% em 5%; fora, MAPE 7,7%, 74% a ±10%, erro >15% em 13%.
  # A confianca calibrada faz o grosso do corte; idade, KM, 0 km/ano seguinte e marcas
  # sem base aparam a cauda.
  official_gate:
    enabled: true
    allowed_confidence: [alta, media] # so "alta": 24% das avaliacoes com a mesma qualidade (4,9% / 87%)
    max_age_years: 10                 # 11+ anos: MAPE 9-11%, vies -7 a -9%
    max_km: 150000                    # >200 mil km: MAPE 14,5%
    exclude_new: true                 # 0 km / ano seguinte: algoritmo paga +6 a +10% acima do ideal
    new_km_threshold: 1000
    exclude_brands: [AUDI, BMW, LAND ROVER]   # dentro do portao BMW da MAPE 9,6% e 57% a ±10%; Audi/LR sem base
    exclude_models: []                # prefixos de model_red, ex. "BMW X6"
    exclude_blindado: true
    min_closed_deals: 0               # testado 3 e 5: nao melhora o dentro, so encolhe (32% / 17%)

  # ── Ancora primaria: buy-ratio (base historica de avaliacoes) ─────────────
  buy_ratio:
    # Pesos por status para mediana ponderada:
    # UTILIZADO/REPASSE = negocios fechados; AVALIADO = oferta que nao fechou.
    utilizado_weight: 1.0
    repasse_weight: 1.0
    # Calibrado a partir de analise de 3k avaliacoes: ratio UTILIZADO sistematicamente
    # ~2.4pp acima de AVALIADO — reduzimos o peso de 0.4 para 0.25 para reduzir vies.
    avaliado_weight: 0.25
    # Janelas de KM por tier de matching (±N km)
    km_window_tight: 6000         # Tier 1: mesmo ano, KM +-6k (12k total)
    km_window_wide: 12000         # Tier 2: mesmo ano, KM +-12k
    km_window_widest: 24000       # Tier 5: ano +-2, KM +-24k
    min_tier_sample: 5            # Minimo de comps para consolidar um tier
    min_fallback_sample: 3        # Minimo absoluto para qualquer estimativa
    # ── Refinamentos adotados na revisao de out/2026 (ver REVISAO_PRECIFICACAO.md, Fase 4) ──
    # Cada item foi medido isoladamente no backtest temporal contra a regua
    # (MAPE 7,9% / ±5% 47% / ±10% 73%). Para reproduzir o comportamento antigo:
    # tier_order: year_first, km_adjust: false, shrink_k: 0.
    tier_order: km_first          # prefere ano vizinho com KM casado a mesmo ano sem KM
    km_adjust: true               # ajusta o ratio de cada comparavel para a KM do carro avaliado
    shrink_k: 3                   # encolhe a mediana local para a referencia do ano: peso n/(n+3)
    year_profile_by_brand: false  # testado, sem ganho mensuravel
    recency_halflife_days: null   # testado (180 e 365 d), sem ganho
    year_adjust_scale: 1.0        # testado 0 e 0,5, sem ganho
    # Correcoes de base (29/10/2026): neutras no erro medio, corrigem casos pontuais graves
    year_profile_min_rows: 30     # celula de ano com <30 avaliacoes nao ajusta (evitava -0,20 em ano-modelo novo)
    dedupe_by_plate: true         # mesma placa avaliada 2x conta uma vez entre os comparaveis

  # ── Destaque na tela: mistura das duas ancoras (adotado na revisao de out/2026) ──
  # 70% historico de compra + 30% analise de vendas. Backtest: MAPE 7,2% -> 6,7%,
  # ±10% 76% -> 80%. "buy_ratio_first" reproduz o comportamento antigo.
  headline_mode: ensemble
  ensemble_weight_buy_ratio: 0.7
  # Alerta na tela quando o valor recomendado passa desta fracao da FIPE: dos 78 fechamentos
  # de 2026 acima de 95% da FIPE (0 km / ano seguinte, troca na venda de novo) um terco saiu
  # com margem negativa. null desliga.
  fipe_ratio_alert: 0.95
  margin_basis: markup          # "sale" (margem sobre a venda, com imposto) testado: mais conservador sem ganhar
  sales_tax_pct: 0.0
  confidence_calibration_file: "data/confidence_calibration.json"

  # ── Higiene da base de avaliacoes (29/10/2026) ──
  # "Valor avaliado" vira o custo ajustado da venda quando a placa casa e os dois diferem
  # >5% (2,6% das fechadas sao erro de lancamento); fechadas com ratio abaixo do P1 da
  # idade saem (um 2023 pago a 58% da FIPE nao existe).
  # Regras de acabamento no model_red (HB20 Platinum/Sense, HR-V Touring/EXL, Onix, Kicks,
  # T-Cross/Nivus Highline, Compass, Corolla Altis Híbrido...): testadas em 29/10, neutras
  # no geral e piores por família (o ratio ja normaliza pela FIPE, que e por versao; separar
  # so encolhe a amostra). Mecanismo em utils/model_generation.TRIM_RULES; fica desligado.
  trim_rules_enabled: false
  # A coluna "BLindado" da plataforma marca so 76 das 312 compras blindadas de 2025-26 e o
  # legado nem tem a coluna; a observacao do avaliador quase sempre diz. Le das duas.
  blindado_from_notes: true
  reconcile_paid_with_sales: true
  reconcile_tolerance: 0.05
  ratio_floor_by_age: {0: 0.70, 1: 0.65, 3: 0.65, 6: 0.58, 10: 0.50, 99: 0.40}

  # ── Fallback de spread FIPE quando nao ha historico suficiente ────────────
  # Sem historico, o spread calculado seria ruidoso. A regra de fallback
  # usa uma razao fixa FIPE x ratio para estimar o preco de venda futuro.
  fipe_spread:
    min_sample_for_spread: 3          # abaixo disso, usa fallback
    comparable_year_fipe: true        # FIPE do ano do proprio comparavel (corrige bug B1; neutro no backtest)
    aggregation: mean                 # "median" testado, sem ganho
    revenda_fallback_ratio: 0.80      # FIPE x 0.80 (desconto B2B tipico)
    # loja_fallback_ratio: null       # Loja mantem FIPE raw como base (sem fallback)

  # ── Margem dinamica por faixa de preco + ajustes por velocidade/volatilidade ──
  # Substitui loja_target_margin (15%) e revenda_target_margin (5.5%) fixos
  # quando enabled=true. As margens foram calibradas a partir das vendas reais.
  dynamic_margin:
    enabled: true
    min_model_sample: 10            # min. vendas historicas para aplicar ajustes por modelo
    max_total_adjustment_pp: 5      # cap nos ajustes somados (velocidade + volatilidade)

    # Margem-alvo BASE por faixa de preco — LOJA (B2C)
    # Avaliadas na ordem; primeira faixa em que sale_price <= max_price vence.
    loja_bands:
      - {max_price:    60000, margin_pct: 20.0}   # populares (mediana real ~21.5%)
      - {max_price:    90000, margin_pct: 14.0}
      - {max_price:   120000, margin_pct: 12.0}
      - {max_price:   160000, margin_pct: 11.0}
      - {max_price:   220000, margin_pct: 10.0}
      - {max_price: 10000000, margin_pct: 10.0}   # premium

    # Margem-alvo BASE por faixa de preco — REVENDA (B2B)
    revenda_bands:
      - {max_price:    60000, margin_pct: 6.0}
      - {max_price:    90000, margin_pct: 3.5}
      - {max_price: 10000000, margin_pct: 3.0}

    # Ajuste por velocidade (mediana de dias em estoque do modelo)
    # Maior threshold vence (avaliado em ordem decrescente).
    speed_adjustments:
      - {threshold: 60, adjustment_pp: 4.0}    # >60d: modelo lento
      - {threshold: 45, adjustment_pp: 2.0}    # 46-60d
      - {threshold: 30, adjustment_pp: 1.0}    # 31-45d

    # Ajuste por volatilidade (std da margem real historica do modelo)
    volatility_adjustments:
      - {threshold: 8.0, adjustment_pp: 3.0}   # muito imprevisivel
      - {threshold: 6.0, adjustment_pp: 2.0}
      - {threshold: 4.0, adjustment_pp: 1.0}

  # ── Curva nao-linear de depreciacao por KM ─────────────────────────────────
  # Substitui o fator linear unico por marca por uma curva piecewise calibrada
  # empiricamente (3k vendas reais). A curva descreve a depreciacao marginal
  # do "brand default"; cada marca recebe um multiplicador = FATOR_KM[canal][brand]
  # / FATOR_KM_DEFAULT[canal]. Com enabled=false, o codigo volta ao modelo linear.
  km_curve:
    enabled: true
    segments:
      - {km_max:    20000, pp_per_10k: 0.5}   # 0-20k: quase sem depreciacao
      - {km_max:    50000, pp_per_10k: 1.2}   # 20-50k: rampa
      - {km_max:   100000, pp_per_10k: 1.6}   # 50-100k: pico (maior decay)
      - {km_max:   160000, pp_per_10k: 1.0}   # 100-160k: suaviza
      - {km_max: 10000000, pp_per_10k: 0.7}   # >160k: plato (carro ja velho)

  # ── Brand tier (Alavanca B) — ajuste de agressividade por marca ─────────────
  # Marcas "SAFE" (alta retencao de valor) recebem ajuste NEGATIVO na margem-alvo,
  # o que eleva o valor oferecido na troca. Marcas "RISKY" (giro lento, muita
  # Revenda) recebem ajuste POSITIVO, reduzindo agressividade.
  # Calibrado a partir de 2.280 vendas (2025): SAFE tem Revenda share 19-39%,
  # RISKY 65-81%. Ver tests/backtests/analyze_revenda_profile.py.
  brand_tier:
    enabled: true
    safe_brands: ["TOYOTA", "HONDA", "HYUNDAI"]
    risky_brands: ["FORD", "PEUGEOT", "RENAULT", "CITROEN"]
    # Calibrado pelo A/B backtest (1.970 avaliacoes com canal real):
    # SAFE: 0.0 - equipe ja precifica SAFE certo historicamente
    #        (bias controle Loja +0.02%, Revenda +1.17%). Aplicar -2pp
    #        piorava MAPE em +0.41pp Loja.
    # RISKY: +2.0 - reduz MAPE em 1.2-1.7pp cortando overpay sistematico
    #        (controle Loja +8.46%, Revenda +13.19% bias).
    safe_adjustment_pp: 0.0        # SAFE baseline ja precifica correto
    risky_adjustment_pp: 2.0       # margem-alvo maior -> troca mais conservadora
    neutral_adjustment_pp: 0.0
    # JEEP fica NEUTRAL de proposito: Jeep novo (0-4 anos) se comporta como SAFE
    # (24-37% Revenda), Jeep antigo (8+ anos) 100% Revenda. A tabela de
    # probabilidade por canal (channel_probability) ja captura essa dinamica
    # naturalmente via buckets de idade/km.

  # ── Channel probability (Alavanca A) — P(Revenda) por perfil ───────────────
  # Predicao calibrada: brand_tier x km_bucket x age_bucket -> P(Revenda).
  # Tabelas vivem em grand_brasil/utils/channel_probability.py (constantes
  # empiricas). Aqui so expomos o toggle e o threshold do "perfil Revenda".
  channel_probability:
    enabled: true
    revenda_profile_threshold: 0.70   # carros com P(Revenda) >= 70% recebem badge

  # ── Premio de blindagem (R$) adicionado ao preco estimado de venda ─────────
  # Aplicado tanto para Loja quanto Revenda quando request.blindado = True.
  # Anos nao listados: premio = 0 (sem efeito).
  # Calibrado empiricamente em abr/2026 a partir de 188 candidatos a blindado
  # detectados nas vendas Loja (canal onde 87% dos blindados sao vendidos).
  # Veja tests/backtests/analyze_blindado_premium.py para metodologia.
  blindado:
    premium_by_year:
      2026: 25000   # extrapolado da tendencia 2024-2025 (sem vendas 2026 ainda)
      2025: 25000   # empirico Loja: R$ 23.986 (n=20)
      2024: 25000   # empirico Loja: R$ 23.005 (n=22)
      2023: 20000   # empirico Loja: R$ 19.395 (n=28)
      2022: 20000   # empirico Loja: R$ 17.635 (n=28)
      2021: 20000   # empirico Loja: R$ 20.500 (n=14)
      2020: 15000   # empirico Loja: R$ 16.495 (n=16)
      2019: 15000   # empirico Loja: R$ 16.000 (n=29)
      2018: 15000   # empirico Loja: R$ 14.000 (n=20)
      2017: 10000   # empirico Loja: R$ 11.500 (n=1, ruidoso)
      2016: 15000   # empirico Loja: R$ 17.490 (n=3, ruidoso)
      2015: 20000   # empirico Loja: R$ 18.995 (n=6)
      2014: 10000   # empirico Loja: R$ 12.900 (n=1, ruidoso)
